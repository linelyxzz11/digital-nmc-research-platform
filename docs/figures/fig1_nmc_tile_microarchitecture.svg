<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#444"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#3e78aa"/></marker>
    <marker id="arrO" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#c95b32"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#38824a"/></marker>
    <pattern id="bankGrid" width="28" height="22" patternUnits="userSpaceOnUse"><rect width="28" height="22" fill="#f8fbff" stroke="#8ba4bd" stroke-width="0.8"/></pattern>
    <style>
      .frame{fill:#fff;stroke:#4e5964;stroke-width:1.8}.blk{stroke-width:1.6}.blue{fill:#e8f1fa;stroke:#4e7fad}.green{fill:#eaf4e9;stroke:#4e8e59}.orange{fill:#fcf0dc;stroke:#d08820}.purple{fill:#f1ebf7;stroke:#8064a2}.gray{fill:#f5f5f3;stroke:#666}.white{fill:#fff;stroke:#555}.ttl{font:700 24px Arial,sans-serif;fill:#151515}.sub{font:700 19px Arial,sans-serif;fill:#191919}.txt{font:16px Arial,sans-serif;fill:#252525}.sm{font:13px Arial,sans-serif;fill:#333}.xs{font:11px Arial,sans-serif;fill:#444}.ctr{text-anchor:middle}.line{fill:none;stroke:#444;stroke-width:1.8;marker-end:url(#arr)}.cmd{fill:none;stroke:#3e78aa;stroke-width:2;marker-end:url(#arrB)}.op{fill:none;stroke:#c95b32;stroke-width:2.4;marker-end:url(#arrO)}.ps{fill:none;stroke:#38824a;stroke-width:2.4;marker-end:url(#arrG)}.dash{fill:none;stroke:#3e78aa;stroke-width:1.5;stroke-dasharray:6 4}.cell{fill:#fff;stroke:#6b6b6b;stroke-width:1}.mul{fill:#fff5e8;stroke:#d08820;stroke-width:1.7}.add{fill:#eef7ee;stroke:#4e8e59;stroke-width:1.7}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <g transform="translate(0,-75)">
  <rect x="25" y="25" width="1550" height="935" class="frame"/>
  <text x="48" y="62" class="ttl">NMC Tile Microarchitecture and Cycle-Level Data Path</text>

  <!-- Command and control -->
  <text x="55" y="105" class="sub">(a) Command and control</text>
  <rect x="55" y="125" width="260" height="120" rx="3" class="blk blue"/>
  <text x="185" y="153" class="sub ctr">Command FIFO</text>
  <rect x="90" y="174" width="190" height="28" class="white"/>
  <text x="185" y="193" class="sm ctr">opcode · tag · addr · len</text>
  <path d="M185 245V266" class="cmd"/>
  <rect x="55" y="280" width="260" height="100" rx="3" class="blk gray"/>
  <text x="185" y="310" class="sub ctr">Tile Controller</text>
  <text x="185" y="351" class="sm ctr">FETCH  →  ISSUE  →  WAIT  →  DONE</text>

  <!-- Bank arrays -->
  <text x="355" y="105" class="sub">(b) Local memory and operand supply</text>
  <rect x="350" y="125" width="580" height="347" rx="3" class="blk purple"/>
  <text x="640" y="153" class="sub ctr">Local Bank / Scratchpad</text>
  <g transform="translate(385 175)">
    <rect x="0" y="0" width="230" height="132" fill="url(#bankGrid)" stroke="#637f9c" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="22" fill="#dceaf6" stroke="#4e7fad"/>
    <text x="115" y="17" class="sm ctr">Weight rows (persistent)</text>
    <rect x="28" y="44" width="56" height="22" fill="#f7d5c6" stroke="#c95b32"/>
    <rect x="112" y="88" width="84" height="22" fill="#f7d5c6" stroke="#c95b32"/>
    <text x="115" y="154" class="sm ctr">Bank 0</text>
  </g>
  <g transform="translate(665 175)">
    <rect x="0" y="0" width="230" height="132" fill="url(#bankGrid)" stroke="#637f9c" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="22" fill="#dceaf6" stroke="#4e7fad"/>
    <text x="115" y="17" class="sm ctr">Activation / output rows</text>
    <rect x="56" y="44" width="84" height="22" fill="#d7efd9" stroke="#38824a"/>
    <rect x="140" y="88" width="56" height="22" fill="#d7efd9" stroke="#38824a"/>
    <text x="115" y="154" class="sm ctr">Bank 1</text>
  </g>
  <rect x="385" y="353" width="230" height="78" class="blk blue"/>
  <text x="500" y="377" class="sub ctr">Input Buffer</text>
  <g transform="translate(405 392)"><rect x="0" y="0" width="24" height="22" class="cell"/><rect x="24" y="0" width="24" height="22" class="cell"/><rect x="48" y="0" width="24" height="22" fill="#f7d5c6" stroke="#c95b32"/><rect x="72" y="0" width="24" height="22" fill="#f7d5c6" stroke="#c95b32"/><rect x="96" y="0" width="24" height="22" class="cell"/><rect x="120" y="0" width="24" height="22" class="cell"/><rect x="144" y="0" width="24" height="22" class="cell"/><rect x="168" y="0" width="24" height="22" class="cell"/></g>
  <rect x="665" y="353" width="230" height="78" class="blk blue"/>
  <text x="780" y="377" class="sub ctr">Weight Buffer</text>
  <g transform="translate(685 392)"><rect x="0" y="0" width="24" height="22" fill="#f7d5c6" stroke="#c95b32"/><rect x="24" y="0" width="24" height="22" fill="#f7d5c6" stroke="#c95b32"/><rect x="48" y="0" width="24" height="22" fill="#f7d5c6" stroke="#c95b32"/><rect x="72" y="0" width="24" height="22" fill="#f7d5c6" stroke="#c95b32"/><rect x="96" y="0" width="24" height="22" class="cell"/><rect x="120" y="0" width="24" height="22" class="cell"/><rect x="144" y="0" width="24" height="22" class="cell"/><rect x="168" y="0" width="24" height="22" class="cell"/></g>
  <path d="M500 307V350M780 307V350" class="op"/>

  <!-- Packet fields -->
  <text x="970" y="105" class="sub">(c) Packet and network endpoint</text>
  <rect x="965" y="125" width="555" height="347" rx="3" class="blk blue"/>
  <text x="1242" y="153" class="sub ctr">Packet format</text>
  <g transform="translate(995 175)">
    <rect x="0" y="0" width="75" height="44" class="white"/><rect x="75" y="0" width="70" height="44" class="white"/><rect x="145" y="0" width="86" height="44" class="white"/><rect x="231" y="0" width="86" height="44" class="white"/><rect x="317" y="0" width="98" height="44" class="white"/><rect x="415" y="0" width="80" height="44" class="white"/>
    <text x="37" y="27" class="xs ctr">opcode</text><text x="110" y="27" class="xs ctr">src/dst</text><text x="188" y="27" class="xs ctr">txn_id</text><text x="274" y="27" class="xs ctr">out_idx</text><text x="366" y="27" class="xs ctr">count/len</text><text x="455" y="27" class="xs ctr">payload</text>
  </g>
  <rect x="995" y="247" width="235" height="174" class="blk white"/>
  <text x="1112" y="274" class="sub ctr">Endpoint NI</text>
  <text x="1015" y="305" class="sm">TX FIFO</text><g transform="translate(1080 287)"><rect x="0" y="0" width="28" height="24" fill="#dbe9f6" stroke="#4e7fad"/><rect x="28" y="0" width="28" height="24" fill="#dbe9f6" stroke="#4e7fad"/><rect x="56" y="0" width="28" height="24" fill="#f4f4f2" stroke="#666"/><rect x="84" y="0" width="28" height="24" fill="#f4f4f2" stroke="#666"/></g>
  <text x="1015" y="346" class="sm">RX FIFO</text><g transform="translate(1080 328)"><rect x="0" y="0" width="28" height="24" fill="#d7efd9" stroke="#38824a"/><rect x="28" y="0" width="28" height="24" fill="#d7efd9" stroke="#38824a"/><rect x="56" y="0" width="28" height="24" fill="#d7efd9" stroke="#38824a"/><rect x="84" y="0" width="28" height="24" fill="#f4f4f2" stroke="#666"/></g>
  <text x="1112" y="390" class="sm ctr">valid / ready</text>
  <g transform="translate(1300 245)">
    <circle cx="90" cy="88" r="43" fill="#e8f1fa" stroke="#4e7fad" stroke-width="2"/>
    <rect x="71" y="69" width="38" height="38" fill="#fff" stroke="#4e7fad"/><path d="M90 69V35M90 107V141M71 88H37M109 88H143" stroke="#4e7fad" stroke-width="7"/>
    <text x="90" y="94" class="sm ctr">Router</text>
    <text x="90" y="173" class="sm ctr">XY · arbitration · 2 VC</text>
  </g>
  <path d="M1230 334H1295" class="cmd"/>

  <!-- Compute datapath -->
  <text x="955" y="520" class="sub">(d) Vector compute, accumulation, and endpoint reduction</text>
  <rect x="55" y="540" width="1465" height="380" rx="3" class="frame"/>
  <rect x="355" y="570" width="575" height="186" rx="3" class="blk orange"/>
  <text x="642" y="600" class="sub ctr">4 × INT8 Vector MAC lanes</text>
  <g transform="translate(390 625)">
<circle cx="95" cy="14" r="20" class="mul"/><text x="95" y="20" class="sub ctr">×</text><circle cx="165" cy="14" r="20" class="add"/><text x="165" y="20" class="sub ctr">+</text><rect x="205" y="-7" width="70" height="42" class="white"/><text x="240" y="19" class="sm ctr">acc[0]</text>
<circle cx="95" cy="57" r="20" class="mul"/><text x="95" y="63" class="sub ctr">×</text><circle cx="165" cy="57" r="20" class="add"/><text x="165" y="63" class="sub ctr">+</text><rect x="205" y="36" width="70" height="42" class="white"/><text x="240" y="62" class="sm ctr">acc[1]</text>
<circle cx="95" cy="100" r="20" class="mul"/><text x="95" y="106" class="sub ctr">×</text><circle cx="165" cy="100" r="20" class="add"/><text x="165" y="106" class="sub ctr">+</text><rect x="205" y="79" width="70" height="42" class="white"/><text x="240" y="105" class="sm ctr">acc[2]</text>
<circle cx="415" cy="14" r="20" class="mul"/><text x="415" y="20" class="sub ctr">×</text><circle cx="485" cy="14" r="20" class="add"/><text x="485" y="20" class="sub ctr">+</text><rect x="525" y="-7" width="70" height="42" class="white"/><text x="560" y="19" class="sm ctr">acc[3]</text>
    <path d="M115 14H143M185 14H203M115 57H143M185 57H203M115 100H143M185 100H203M435 14H463M505 14H523" class="line"/>
  </g>
  <path d="M500 431V570M780 431V570" class="op"/>

  <rect x="955" y="570" width="255" height="186" rx="3" class="blk green"/>
  <text x="1082" y="600" class="sub ctr">INT32 Accumulator RF</text>
  <g transform="translate(985 625)">
    <rect x="0" y="0" width="48" height="34" class="cell"/><rect x="48" y="0" width="48" height="34" class="cell"/><rect x="96" y="0" width="48" height="34" class="cell"/><rect x="144" y="0" width="48" height="34" class="cell"/>
    <rect x="0" y="34" width="48" height="34" class="cell"/><rect x="48" y="34" width="48" height="34" class="cell"/><rect x="96" y="34" width="48" height="34" class="cell"/><rect x="144" y="34" width="48" height="34" class="cell"/>
    <text x="24" y="22" class="xs ctr">y0</text><text x="72" y="22" class="xs ctr">y1</text><text x="120" y="22" class="xs ctr">y2</text><text x="168" y="22" class="xs ctr">y3</text>
    <text x="96" y="98" class="sm ctr">writeback / local output</text>
  </g>
  <path d="M930 663H952" class="ps"/>

  <rect x="1235" y="550" width="250" height="226" rx="3" class="blk green"/>
  <text x="1360" y="579" class="sub ctr">Reduction Buffer</text>
  <g transform="translate(1255 602)">
    <rect x="0" y="0" width="210" height="28" fill="#dcebdc" stroke="#4e8e59"/>
    <text x="28" y="19" class="xs ctr">txn</text><text x="77" y="19" class="xs ctr">idx</text><text x="125" y="19" class="xs ctr">cnt</text><text x="174" y="19" class="xs ctr">psum</text>
    <rect x="0" y="28" width="210" height="28" class="cell"/><rect x="0" y="56" width="210" height="28" class="cell"/><rect x="0" y="84" width="210" height="28" class="cell"/>
    <line x1="52" y1="0" x2="52" y2="112" stroke="#777"/><line x1="101" y1="0" x2="101" y2="112" stroke="#777"/><line x1="149" y1="0" x2="149" y2="112" stroke="#777"/>
    <text x="26" y="47" class="xs ctr">17</text><text x="76" y="47" class="xs ctr">03</text><text x="125" y="47" class="xs ctr">2/4</text><text x="180" y="47" class="xs ctr">+241</text>
    <text x="26" y="75" class="xs ctr">17</text><text x="76" y="75" class="xs ctr">04</text><text x="125" y="75" class="xs ctr">4/4</text><text x="180" y="75" class="xs ctr">−92</text>
    <text x="105" y="139" class="sm ctr">tag match + add + completion</text>
  </g>
  <path d="M1210 663H1233" class="ps"/>

  <!-- Lower network path and control -->
  <rect x="355" y="800" width="1130" height="86" rx="3" class="blk blue"/>
  <text x="510" y="832" class="sub ctr">Endpoint NI</text>
  <text x="790" y="832" class="sub ctr">Local FIFO</text>
  <g transform="translate(700 846)"><rect x="0" y="0" width="32" height="22" fill="#d7efd9" stroke="#38824a"/><rect x="32" y="0" width="32" height="22" fill="#d7efd9" stroke="#38824a"/><rect x="64" y="0" width="32" height="22" fill="#d7efd9" stroke="#38824a"/><rect x="96" y="0" width="32" height="22" fill="#f4f4f2" stroke="#666"/><rect x="128" y="0" width="32" height="22" fill="#f4f4f2" stroke="#666"/></g>
  <text x="1080" y="832" class="sub ctr">Router local port</text>
  <text x="1080" y="859" class="sm ctr">XY · VC · arbitration</text>
  <path d="M1485 843H1520" class="ps"/>
  <path d="M1360 776V797" class="ps"/>
  <text x="65" y="902" class="sm">Blue: command/control</text><text x="245" y="902" class="sm" fill="#c95b32">Orange: operand movement</text><text x="475" y="902" class="sm" fill="#38824a">Green: partial sum/result</text>
  </g>
</svg>
