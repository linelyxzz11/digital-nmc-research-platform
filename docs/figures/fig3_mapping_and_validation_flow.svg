<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#454545"/></marker>
    <marker id="ab" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#447aaa"/></marker>
    <pattern id="m" width="20" height="18" patternUnits="userSpaceOnUse"><rect width="20" height="18" fill="#fff" stroke="#8899a8" stroke-width=".6"/></pattern>
    <style>
      .frame{fill:#fff;stroke:#53606a;stroke-width:1.6}.blue{fill:#e8f1fa;stroke:#4e7fad;stroke-width:1.5}.green{fill:#e8f3e8;stroke:#4e8e59;stroke-width:1.5}.orange{fill:#fcf0dc;stroke:#d0871e;stroke-width:1.5}.purple{fill:#f0eaf6;stroke:#8064a2;stroke-width:1.5}.gray{fill:#f4f4f2;stroke:#666;stroke-width:1.5}.white{fill:#fff;stroke:#666;stroke-width:1.1}.ttl{font:700 21px Arial,sans-serif;fill:#161616}.lab{font:700 16px Arial,sans-serif;fill:#191919}.txt{font:14px Arial,sans-serif;fill:#292929}.sm{font:12px Arial,sans-serif;fill:#3b3b3b}.xs{font:10px Arial,sans-serif;fill:#444}.ctr{text-anchor:middle}.flow{fill:none;stroke:#454545;stroke-width:2;marker-end:url(#a)}.cfg{fill:none;stroke:#447aaa;stroke-width:1.8;stroke-dasharray:6 4;marker-end:url(#ab)}.node{fill:#f4f4f2;stroke:#616161;stroke-width:1.2}.sheet{fill:#fff;stroke:#607080;stroke-width:1.3}.tick{fill:none;stroke:#4e8e59;stroke-width:2.4}.bar1{fill:#4e7fad}.bar2{fill:#d0871e}.bar3{fill:#4e8e59}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>

  <!-- Workload and operator analysis -->
  <text x="25" y="35" class="ttl">(a) Workload → Operator IR</text>
  <rect x="20" y="50" width="290" height="800" class="frame"/>
  <g transform="translate(58 95)">
    <circle cx="45" cy="20" r="14" class="node"/><circle cx="105" cy="20" r="14" class="node"/><circle cx="165" cy="20" r="14" class="node"/><circle cx="225" cy="20" r="14" class="node"/>
    <circle cx="75" cy="95" r="15" class="node"/><circle cx="145" cy="95" r="15" class="node"/><circle cx="210" cy="95" r="15" class="node"/>
    <circle cx="95" cy="170" r="15" class="node"/><circle cx="180" cy="170" r="15" class="node"/>
    <path d="M45 34L75 79M105 34L75 79M105 34L145 79M165 34L145 79M165 34L210 79M225 34L210 79M75 110L95 154M145 110L95 154M145 110L180 154M210 110L180 154" class="flow"/>
    <text x="135" y="215" class="lab ctr">MLP / decode trace</text>
  </g>
  <path d="M165 338V372" class="flow"/>
  <rect x="52" y="374" width="225" height="96" class="gray"/>
  <text x="164" y="405" class="lab ctr">Operator analysis</text>
  <text x="164" y="431" class="txt ctr">GEMV: M × K</text><text x="164" y="454" class="sm ctr">dependencies · tensor lifetime</text>
  <path d="M164 470V510" class="flow"/>
  <path d="M62 510H267L248 670H62Z" class="sheet"/>
  <path d="M62 510L87 535H267" fill="#eef3f7" stroke="#607080"/>
  <text x="164" y="560" class="lab ctr">Operator IR</text>
  <text x="80" y="592" class="txt">op: GEMV_17</text><text x="80" y="620" class="txt">W: [4096, 11008]</text><text x="80" y="648" class="txt">x: [11008, 1]</text>
  <rect x="52" y="720" width="225" height="88" class="blue"/>
  <text x="164" y="751" class="lab ctr">Architecture config</text><text x="164" y="777" class="sm ctr">Tile · Bank · MAC · FIFO</text><text x="164" y="797" class="sm ctr">link and service latency</text>

  <!-- Partition search -->
  <text x="335" y="35" class="ttl">(b) GEMV partition</text>
  <rect x="330" y="50" width="365" height="800" class="frame"/>
  <text x="512" y="82" class="lab ctr">Same W matrix, three legal decompositions</text>
  <g transform="translate(375 115)">
    <text x="0" y="14" class="txt">row</text><rect x="55" y="0" width="240" height="126" fill="url(#m)" stroke="#607080"/>
    <rect x="55" y="0" width="240" height="36" fill="#dbe9f6" stroke="#4e7fad"/><rect x="55" y="36" width="240" height="36" fill="#e8f3e8" stroke="#4e8e59"/><rect x="55" y="72" width="240" height="36" fill="#fcf0dc" stroke="#d0871e"/><rect x="55" y="108" width="240" height="18" fill="#f0eaf6" stroke="#8064a2"/>
    <text x="175" y="148" class="sm ctr">broadcast x · independent y</text>
  </g>
  <g transform="translate(375 300)">
    <text x="0" y="14" class="txt">K</text><rect x="55" y="0" width="240" height="126" fill="url(#m)" stroke="#607080"/>
    <rect x="55" y="0" width="60" height="126" fill="#dbe9f6" stroke="#4e7fad"/><rect x="115" y="0" width="60" height="126" fill="#e8f3e8" stroke="#4e8e59"/><rect x="175" y="0" width="60" height="126" fill="#fcf0dc" stroke="#d0871e"/><rect x="235" y="0" width="60" height="126" fill="#f0eaf6" stroke="#8064a2"/>
    <text x="175" y="148" class="sm ctr">scatter x slices · reduce psums</text>
  </g>
  <g transform="translate(375 485)">
    <text x="0" y="14" class="txt">2-D</text><rect x="55" y="0" width="240" height="126" fill="url(#m)" stroke="#607080"/>
    <rect x="55" y="0" width="120" height="63" fill="#dbe9f6" stroke="#4e7fad"/><rect x="175" y="0" width="120" height="63" fill="#e8f3e8" stroke="#4e8e59"/><rect x="55" y="63" width="120" height="63" fill="#fcf0dc" stroke="#d0871e"/><rect x="175" y="63" width="120" height="63" fill="#f0eaf6" stroke="#8064a2"/>
    <text x="175" y="148" class="sm ctr">broadcast groups · inter-group reduce</text>
  </g>
  <rect x="367" y="682" width="290" height="120" class="orange"/>
  <text x="512" y="714" class="lab ctr">Candidate generator</text>
  <text x="512" y="741" class="txt ctr">partition × placement × root</text><text x="512" y="766" class="txt ctr">× reduction topology × order</text><text x="512" y="790" class="sm ctr">prune illegal capacity assignments</text>
  <path d="M310 610H328" class="flow"/><path d="M277 764H330" class="cfg"/>

  <!-- Placement and traffic -->
  <text x="720" y="35" class="ttl">(c) Placement + cost</text>
  <rect x="715" y="50" width="395" height="800" class="frame"/>
  <text x="912" y="82" class="lab ctr">Candidate placement on a 4 × 4 mesh</text>
  <g transform="translate(770 115)">
    <path d="M40 40H260M40 110H260M40 180H260M40 250H260M40 40V250M113 40V250M187 40V250M260 40V250" stroke="#758b9b" stroke-width="5" fill="none"/>
    <g class="ctr">
      <circle cx="40" cy="40" r="24" fill="#dbe9f6" stroke="#4e7fad"/><circle cx="113" cy="40" r="24" fill="#dbe9f6" stroke="#4e7fad"/><circle cx="187" cy="40" r="24" fill="#e8f3e8" stroke="#4e8e59"/><circle cx="260" cy="40" r="24" fill="#f4f4f2" stroke="#666"/>
      <circle cx="40" cy="110" r="24" fill="#fcf0dc" stroke="#d0871e"/><circle cx="113" cy="110" r="24" fill="#e8f3e8" stroke="#4e8e59"/><circle cx="187" cy="110" r="24" fill="#f0eaf6" stroke="#8064a2"/><circle cx="260" cy="110" r="24" fill="#f4f4f2" stroke="#666"/>
      <circle cx="40" cy="180" r="24" fill="#fcf0dc" stroke="#d0871e"/><circle cx="113" cy="180" r="24" fill="#f0eaf6" stroke="#8064a2"/><circle cx="187" cy="180" r="24" fill="#e8f3e8" stroke="#4e8e59"/><circle cx="260" cy="180" r="24" fill="#f4f4f2" stroke="#666"/>
      <circle cx="40" cy="250" r="24" fill="#f4f4f2" stroke="#666"/><circle cx="113" cy="250" r="24" fill="#f4f4f2" stroke="#666"/><circle cx="187" cy="250" r="24" fill="#f4f4f2" stroke="#666"/><circle cx="260" cy="250" r="24" fill="#f4f4f2" stroke="#666"/>
    </g>
    <path d="M40 40H113V110H187V180" fill="none" stroke="#c95b32" stroke-width="5" marker-end="url(#a)"/>
    <path d="M40 180H113V110H187" fill="none" stroke="#3f8350" stroke-width="4" stroke-dasharray="8 4" marker-end="url(#a)"/>
    <text x="150" y="302" class="sm ctr">solid: operand route · dashed: reduction route</text>
  </g>
  <rect x="755" y="470" width="315" height="140" class="blue"/>
  <text x="912" y="500" class="lab ctr">Resource-aware cost</text>
  <text x="778" y="532" class="txt">Bank service:</text><text x="1035" y="532" class="txt" text-anchor="end">busy + conflict</text>
  <text x="778" y="559" class="txt">NoC:</text><text x="1035" y="559" class="txt" text-anchor="end">flit-hop + hotspot</text>
  <text x="778" y="586" class="txt">FIFO / reduction:</text><text x="1035" y="586" class="txt" text-anchor="end">stall + dependency</text>
  <rect x="755" y="650" width="315" height="152" class="green"/>
  <text x="912" y="680" class="lab ctr">Selected plan</text>
  <path d="M785 706H1040" stroke="#666"/><text x="790" y="728" class="sm">partition</text><text x="1035" y="728" class="sm" text-anchor="end">2-D (2 × 4)</text>
  <text x="790" y="754" class="sm">placement</text><text x="1035" y="754" class="sm" text-anchor="end">near-root groups</text>
  <text x="790" y="780" class="sm">reduction</text><text x="1035" y="780" class="sm" text-anchor="end">grouped tree</text>
  <path d="M695 742H712" class="flow"/>

  <!-- Trace generation -->
  <text x="1135" y="35" class="ttl">(d) ISA / packet trace</text>
  <rect x="1130" y="50" width="210" height="800" class="frame"/>
  <g transform="translate(1160 105)">
    <path d="M12 18H165L180 33V270H12Z" fill="#eef3f7" stroke="#607080"/><path d="M0 6H153L168 21V258H0Z" fill="#fff" stroke="#607080"/>
    <text x="84" y="38" class="lab ctr">ISA trace</text>
    <text x="16" y="70" class="sm">CFG  M,K,batch</text><text x="16" y="96" class="sm">LDW  tile,addr</text><text x="16" y="122" class="sm">SEND src,dst,x</text><text x="16" y="148" class="sm">GEMV tile,tag</text><text x="16" y="174" class="sm">RED  root,cnt</text><text x="16" y="200" class="sm">WAIT tag</text><text x="16" y="226" class="sm">DONE tag</text>
  </g>
  <g transform="translate(1160 430)">
    <path d="M12 18H165L180 33V225H12Z" fill="#eef3f7" stroke="#607080"/><path d="M0 6H153L168 21V213H0Z" fill="#fff" stroke="#607080"/>
    <text x="84" y="38" class="lab ctr">Packet trace</text>
    <text x="16" y="72" class="sm">cycle  src → dst</text><text x="16" y="100" class="sm">0120   H → T0  x</text><text x="16" y="128" class="sm">0134   T0 → T1 x</text><text x="16" y="156" class="sm">0288   T3 → R psum</text><text x="16" y="184" class="sm">0312   R → H done</text>
  </g>
  <rect x="1158" y="700" width="155" height="82" class="orange"/>
  <text x="1235" y="730" class="lab ctr">One source</text><text x="1235" y="754" class="sm ctr">for all backends</text>
  <path d="M1110 725H1128" class="flow"/>

  <!-- Validation backends -->
  <text x="1365" y="35" class="ttl">(e) Model / RTL checks</text>
  <rect x="1360" y="50" width="220" height="800" class="frame"/>
  <rect x="1385" y="100" width="170" height="92" class="green"/><text x="1470" y="133" class="lab ctr">NumPy Golden</text><text x="1470" y="160" class="sm ctr">exact INT8/INT32 result</text>
  <rect x="1385" y="225" width="170" height="92" class="blue"/><text x="1470" y="258" class="lab ctr">Event model</text><text x="1470" y="285" class="sm ctr">cycles · queues · traffic</text>
  <rect x="1385" y="350" width="170" height="92" class="purple"/><text x="1470" y="383" class="lab ctr">RTL testbench</text><text x="1470" y="410" class="sm ctr">waveform · counters</text>
  <path d="M1340 145H1382M1340 270H1382M1340 395H1382" class="flow"/>
  <rect x="1385" y="486" width="170" height="115" class="gray"/>
  <text x="1470" y="515" class="lab ctr">Consistency checks</text>
  <path d="M1410 540L1421 551L1440 529" class="tick"/><text x="1450" y="550" class="sm">numeric result</text>
  <path d="M1410 571L1421 582L1440 560" class="tick"/><text x="1450" y="581" class="sm">trace completion</text>
  <rect x="1385" y="650" width="170" height="152" class="white"/>
  <text x="1470" y="677" class="lab ctr">Result record</text>
  <g transform="translate(1410 704)"><rect x="0" y="50" width="24" height="22" class="bar1"/><rect x="38" y="25" width="24" height="47" class="bar2"/><rect x="76" y="8" width="24" height="64" class="bar3"/><line x1="-8" y1="72" x2="115" y2="72" stroke="#555"/><text x="12" y="92" class="xs ctr">Bank</text><text x="50" y="92" class="xs ctr">NoC</text><text x="88" y="92" class="xs ctr">MAC</text></g>
  <text x="1470" y="820" class="sm ctr">CSV + config + seed</text>

  <!-- Global path -->
  <path d="M310 430H330M695 430H715M1110 430H1130M1340 430H1360" class="flow"/>
</svg>
