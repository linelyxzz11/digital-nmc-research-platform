<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#444"/></marker>
    <marker id="ao" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#cc5a32"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#3c7f49"/></marker>
    <pattern id="g" width="16" height="13" patternUnits="userSpaceOnUse"><rect width="16" height="13" fill="#fafcff" stroke="#9aacc0" stroke-width=".6"/></pattern>
    <style>
      .frame{fill:#fff;stroke:#505c66;stroke-width:1.7}.blue{fill:#e8f1fa;stroke:#4e7fad;stroke-width:1.5}.green{fill:#e9f3e8;stroke:#4e8e59;stroke-width:1.5}.orange{fill:#fcf0dd;stroke:#d0871e;stroke-width:1.5}.purple{fill:#f0eaf6;stroke:#8064a2;stroke-width:1.5}.gray{fill:#f4f4f2;stroke:#666;stroke-width:1.5}.white{fill:#fff;stroke:#666;stroke-width:1.2}.ttl{font:700 22px Arial,sans-serif;fill:#171717}.lab{font:700 16px Arial,sans-serif;fill:#181818}.txt{font:14px Arial,sans-serif;fill:#292929}.sm{font:12px Arial,sans-serif;fill:#3a3a3a}.xs{font:10px Arial,sans-serif;fill:#444}.ctr{text-anchor:middle}.mesh{fill:none;stroke:#708797;stroke-width:5}.flow{fill:none;stroke:#444;stroke-width:1.8;marker-end:url(#a)}.op{fill:none;stroke:#cc5a32;stroke-width:2.6;marker-end:url(#ao)}.psum{fill:none;stroke:#3c7f49;stroke-width:2.6;stroke-dasharray:8 4;marker-end:url(#ag)}.bp{fill:none;stroke:#7d4e9f;stroke-width:2;stroke-dasharray:3 3;marker-end:url(#a)}.router{fill:#dceaf6;stroke:#4e7fad;stroke-width:1.4}
    </style>
  </defs>
  <rect width="1600" height="1020" fill="#fff"/>

  <!-- Main organization -->
  <text x="25" y="33" class="ttl">(a) Directly connected multi-tile NMC system</text>
  <rect x="20" y="48" width="1560" height="635" class="frame"/>

  <!-- Host and memory-side interface -->
  <rect x="50" y="92" width="185" height="100" rx="12" class="gray"/>
  <text x="142" y="130" class="lab ctr">Host CPU</text><text x="142" y="156" class="txt ctr">runtime + mapper</text>
  <rect x="50" y="225" width="185" height="100" rx="12" class="blue"/>
  <text x="142" y="262" class="lab ctr">Memory Controller</text><text x="142" y="288" class="txt ctr">DMA + address map</text>
  <path d="M142 192V222" class="flow"/>
  <rect x="50" y="365" width="250" height="178" class="gray"/>
  <text x="175" y="397" class="lab ctr">Host–NMC interface</text>
  <rect x="75" y="419" width="200" height="32" class="white"/><text x="175" y="440" class="txt ctr">Command queue</text>
  <rect x="75" y="460" width="200" height="32" class="white"/><text x="175" y="481" class="txt ctr">DMA descriptor ring</text>
  <rect x="75" y="501" width="200" height="24" class="white"/><text x="175" y="518" class="sm ctr">completion | counters | errors</text>
  <path d="M142 325V362" class="flow"/>

  <!-- Mesh background and links -->
  <rect x="350" y="78" width="1195" height="555" fill="#fbfcfd" stroke="#7890a0" stroke-width="1.4"/>
  <text x="370" y="106" class="lab">2D Mesh NoC: XY routing, finite input FIFO, valid/ready backpressure</text>
  <path d="M565 210H880H1195 M565 390H880H1195 M565 570H880H1195 M520 250V350V530 M835 250V350V530 M1150 250V350V530" class="mesh"/>

  <!-- 3x3 tiles, row 0 -->
  <g transform="translate(435 130)"><rect width="170" height="120" rx="3" class="purple"/><text x="85" y="23" class="lab ctr">Tile 0</text><rect x="17" y="37" width="82" height="52" fill="url(#g)" stroke="#718aa4"/><rect x="110" y="37" width="43" height="52" class="orange"/><text x="58" y="69" class="sm ctr">Bank</text><text x="131" y="61" class="sm ctr">MAC</text><text x="131" y="78" class="sm ctr">×4</text><rect x="66" y="96" width="38" height="23" class="router"/><text x="85" y="112" class="xs ctr">R/NI</text></g>
  <g transform="translate(750 130)"><rect width="170" height="120" rx="3" class="purple"/><text x="85" y="23" class="lab ctr">Tile 1</text><rect x="17" y="37" width="82" height="52" fill="url(#g)" stroke="#718aa4"/><rect x="110" y="37" width="43" height="52" class="orange"/><text x="58" y="69" class="sm ctr">Bank</text><text x="131" y="61" class="sm ctr">MAC</text><text x="131" y="78" class="sm ctr">×4</text><rect x="66" y="96" width="38" height="23" class="router"/><text x="85" y="112" class="xs ctr">R/NI</text></g>
  <g transform="translate(1065 130)"><rect width="170" height="120" rx="3" class="purple"/><text x="85" y="23" class="lab ctr">Tile 2</text><rect x="17" y="37" width="82" height="52" fill="url(#g)" stroke="#718aa4"/><rect x="110" y="37" width="43" height="52" class="orange"/><text x="58" y="69" class="sm ctr">Bank</text><text x="131" y="61" class="sm ctr">MAC</text><text x="131" y="78" class="sm ctr">×4</text><rect x="66" y="96" width="38" height="23" class="router"/><text x="85" y="112" class="xs ctr">R/NI</text></g>
  <!-- row 1 -->
  <g transform="translate(435 310)"><rect width="170" height="120" rx="3" class="purple"/><text x="85" y="23" class="lab ctr">Tile 3</text><rect x="17" y="37" width="82" height="52" fill="url(#g)" stroke="#718aa4"/><rect x="110" y="37" width="43" height="52" class="orange"/><text x="58" y="69" class="sm ctr">Bank</text><text x="131" y="61" class="sm ctr">MAC</text><text x="131" y="78" class="sm ctr">×4</text><rect x="66" y="96" width="38" height="23" class="router"/><text x="85" y="112" class="xs ctr">R/NI</text></g>
  <g transform="translate(750 310)"><rect width="170" height="120" rx="3" class="purple"/><text x="85" y="23" class="lab ctr">Tile 4</text><rect x="17" y="37" width="82" height="52" fill="url(#g)" stroke="#718aa4"/><rect x="110" y="37" width="43" height="52" class="orange"/><text x="58" y="69" class="sm ctr">Bank</text><text x="131" y="61" class="sm ctr">MAC</text><text x="131" y="78" class="sm ctr">×4</text><rect x="66" y="96" width="38" height="23" class="router"/><text x="85" y="112" class="xs ctr">R/NI</text></g>
  <g transform="translate(1065 310)"><rect width="170" height="120" rx="3" class="purple"/><text x="85" y="23" class="lab ctr">Tile 5</text><rect x="17" y="37" width="82" height="52" fill="url(#g)" stroke="#718aa4"/><rect x="110" y="37" width="43" height="52" class="orange"/><text x="58" y="69" class="sm ctr">Bank</text><text x="131" y="61" class="sm ctr">MAC</text><text x="131" y="78" class="sm ctr">×4</text><rect x="66" y="96" width="38" height="23" class="router"/><text x="85" y="112" class="xs ctr">R/NI</text></g>
  <!-- row 2 -->
  <g transform="translate(435 490)"><rect width="170" height="120" rx="3" class="purple"/><text x="85" y="23" class="lab ctr">Tile 6</text><rect x="17" y="37" width="82" height="52" fill="url(#g)" stroke="#718aa4"/><rect x="110" y="37" width="43" height="52" class="orange"/><text x="58" y="69" class="sm ctr">Bank</text><text x="131" y="61" class="sm ctr">MAC</text><text x="131" y="78" class="sm ctr">×4</text><rect x="66" y="96" width="38" height="23" class="router"/><text x="85" y="112" class="xs ctr">R/NI</text></g>
  <g transform="translate(750 490)"><rect width="170" height="120" rx="3" class="purple"/><text x="85" y="23" class="lab ctr">Tile 7</text><rect x="17" y="37" width="82" height="52" fill="url(#g)" stroke="#718aa4"/><rect x="110" y="37" width="43" height="52" class="orange"/><text x="58" y="69" class="sm ctr">Bank</text><text x="131" y="61" class="sm ctr">MAC</text><text x="131" y="78" class="sm ctr">×4</text><rect x="66" y="96" width="38" height="23" class="router"/><text x="85" y="112" class="xs ctr">R/NI</text></g>
  <g transform="translate(1065 490)"><rect width="170" height="120" rx="3" class="purple"/><text x="85" y="23" class="lab ctr">Tile 8 / root</text><rect x="17" y="37" width="82" height="52" fill="url(#g)" stroke="#718aa4"/><rect x="110" y="37" width="43" height="52" class="green"/><text x="58" y="69" class="sm ctr">Bank</text><text x="131" y="61" class="sm ctr">RED</text><text x="131" y="78" class="sm ctr">buf</text><rect x="66" y="96" width="38" height="23" class="router"/><text x="85" y="112" class="xs ctr">R/NI</text></g>

  <!-- Injection, broadcast, reduction, backpressure -->
  <path d="M300 437H380V210H434" class="op"/><text x="314" y="422" class="sm">operand packets</text>
  <path d="M520 210H835H1150" class="op"/><path d="M520 210V390V570" class="op"/><path d="M835 210V390" class="op"/>
  <text x="665" y="198" class="sm">broadcast: solid arrow</text>
  <path d="M520 570H835H1150M835 390V570M1150 210V390V570" class="psum"/>
  <text x="938" y="588" class="sm">hierarchical reduction: dashed arrow</text>
  <path d="M1150 570H1325V520H1435" class="psum"/><rect x="1325" y="480" width="180" height="72" class="green"/><text x="1415" y="507" class="lab ctr">Completion</text><text x="1415" y="532" class="sm ctr">INT32 result + cycles</text>
  <!-- congested FIFO callout -->
  <rect x="1248" y="280" width="265" height="112" class="orange"/>
  <text x="1380" y="306" class="lab ctr">Congestion example</text>
  <text x="1270" y="334" class="sm">west input FIFO</text><g transform="translate(1370 316)"><rect x="0" y="0" width="24" height="22" fill="#efb08e" stroke="#a84425"/><rect x="24" y="0" width="24" height="22" fill="#efb08e" stroke="#a84425"/><rect x="48" y="0" width="24" height="22" fill="#efb08e" stroke="#a84425"/><rect x="72" y="0" width="24" height="22" fill="#efb08e" stroke="#a84425"/></g>
  <text x="1380" y="365" class="sm ctr">4/4 full → ready=0</text>
  <path d="M1248 370H1230V418H1171" class="bp"/><text x="1270" y="386" class="xs">backpressure propagates upstream</text>

  <!-- Data partition cases -->
  <text x="25" y="720" class="ttl">(b) Output-row partition: broadcast once, independent outputs</text>
  <rect x="20" y="735" width="760" height="245" class="frame"/>
  <rect x="45" y="775" width="120" height="60" class="blue"/><text x="105" y="801" class="lab ctr">Input x</text><text x="105" y="824" class="sm ctr">global buffer</text>
  <path d="M165 805H230M165 805H195V875H230" class="op"/>
  <g transform="translate(230 760)"><rect width="115" height="78" class="purple"/><rect x="12" y="15" width="60" height="42" fill="url(#g)" stroke="#718aa4"/><rect x="80" y="15" width="24" height="42" class="orange"/><text x="42" y="70" class="xs ctr">W rows 0–1</text></g>
  <g transform="translate(370 760)"><rect width="115" height="78" class="purple"/><rect x="12" y="15" width="60" height="42" fill="url(#g)" stroke="#718aa4"/><rect x="80" y="15" width="24" height="42" class="orange"/><text x="42" y="70" class="xs ctr">W rows 2–3</text></g>
  <g transform="translate(230 865)"><rect width="115" height="78" class="purple"/><rect x="12" y="15" width="60" height="42" fill="url(#g)" stroke="#718aa4"/><rect x="80" y="15" width="24" height="42" class="orange"/><text x="42" y="70" class="xs ctr">W rows 4–5</text></g>
  <g transform="translate(370 865)"><rect width="115" height="78" class="purple"/><rect x="12" y="15" width="60" height="42" fill="url(#g)" stroke="#718aa4"/><rect x="80" y="15" width="24" height="42" class="orange"/><text x="42" y="70" class="xs ctr">W rows 6–7</text></g>
  <path d="M345 799H368M345 904H368" class="op"/>
  <rect x="535" y="792" width="205" height="120" class="green"/><text x="637" y="824" class="lab ctr">Independent outputs</text><text x="637" y="854" class="txt ctr">Tile 0 → y0,y1</text><text x="637" y="878" class="txt ctr">Tile 1 → y2,y3 …</text><text x="637" y="901" class="sm ctr">no cross-tile sum</text>
  <path d="M485 850H532" class="psum"/>

  <text x="815" y="720" class="ttl">(c) K partition: input slices and partial-sum reduction</text>
  <rect x="810" y="735" width="770" height="245" class="frame"/>
  <g transform="translate(840 760)"><rect width="115" height="78" class="purple"/><rect x="12" y="15" width="60" height="42" fill="url(#g)" stroke="#718aa4"/><rect x="80" y="15" width="24" height="42" class="orange"/><text x="42" y="70" class="xs ctr">W[:,0:2]</text></g>
  <g transform="translate(980 760)"><rect width="115" height="78" class="purple"/><rect x="12" y="15" width="60" height="42" fill="url(#g)" stroke="#718aa4"/><rect x="80" y="15" width="24" height="42" class="orange"/><text x="42" y="70" class="xs ctr">W[:,2:4]</text></g>
  <g transform="translate(840 865)"><rect width="115" height="78" class="purple"/><rect x="12" y="15" width="60" height="42" fill="url(#g)" stroke="#718aa4"/><rect x="80" y="15" width="24" height="42" class="orange"/><text x="42" y="70" class="xs ctr">W[:,4:6]</text></g>
  <g transform="translate(980 865)"><rect width="115" height="78" class="purple"/><rect x="12" y="15" width="60" height="42" fill="url(#g)" stroke="#718aa4"/><rect x="80" y="15" width="24" height="42" class="orange"/><text x="42" y="70" class="xs ctr">W[:,6:8]</text></g>
  <text x="897" y="853" class="xs ctr">x0:2</text><text x="1037" y="853" class="xs ctr">x2:4</text>
  <path d="M955 799H978M955 904H978" class="op"/>
  <circle cx="1170" cy="817" r="25" class="green"/><circle cx="1170" cy="905" r="25" class="green"/><text x="1170" y="823" class="lab ctr">+</text><text x="1170" y="911" class="lab ctr">+</text>
  <path d="M1095 799H1142M1095 904H1142M1170 842V878" class="psum"/>
  <circle cx="1270" cy="860" r="28" class="green"/><text x="1270" y="867" class="lab ctr">+</text><path d="M1195 817H1225V850H1240M1195 905H1225V870H1240" class="psum"/>
  <rect x="1340" y="820" width="190" height="80" class="green"/><text x="1435" y="851" class="lab ctr">Final y</text><text x="1435" y="879" class="sm ctr">all partial sums complete</text><path d="M1298 860H1337" class="psum"/>

  <text x="585" y="1008" class="sm">Orange solid: input/operand traffic</text><text x="870" y="1008" class="sm">Green dashed: partial sum/completion</text><text x="1160" y="1008" class="sm">Purple dotted: backpressure</text>
</svg>
